"Public Remarks": "ONE OF A KIND OPPORTUNITY!  Live in this quaint home at 11 Rock Street, in Kingston, and enjoy additional lots  for a great price!  The 2 bedroom 1 bath brick home is located in City of Kingston, but provides a rural/country atmosphere.  All new windows that beams sunlight throughout.  Brand new kitchen cabinets and appliances.  For extra storage the spacious attic is ready for all your  stuff.  Roof is approximately 12 years old.  PLUS two additional, vacant lots which new owner can build an additional home or add a pool.   Rock Street is situated near Kingston's waterfront district and historic neighborhoods. It offers proximity to Downtown Rondout: Hutton brickyard, storefronts, local art galleries, waterfront dining, and boating along the Rondout Creek.  Kingston Point Park: Nearby public access to Hudson River beach areas, trails, and picnic spots. Uptown Kingston (Stockade District): A short drive away, offering local farmers markets, music venues, and historical sites."
