"Public Remarks": "Perched high above the Hudson River is a 5000+ square feet unfinished home awaiting your finishing touches .  This property, nicely situated on approximately 2 acres overlooking the Hudson River near the Kingston-Rhinecliff Bridge, is a place to enjoy   the tranquility as you watch for bald eagles soaring. This work-in-progress is the culmination of a dream that the owner had when  he was a boy.  The owner lovingly built a remarkable home with beautiful stonework, whose centerpiece is an  enormous Great Room with wood-paneled vaulted ceiling , floors -to-ceiling windows and a wood-burning fireplace.  The approximately 4000 square feet addition has radiant heat, with heated  floors throughout, including the garage and basement floors.  The home also features 4'' thick Douglas Fir trim, Weather Shield windows, Alder solid-wood doors, beautiful tile and hardwood floors, French doors and underground utilities. In addition to the Great Room, this home is comprised o 2 apartments, plus the original structure from 1920.  Each apartment has beautiful granite countertops, solid wood cabinets, and gas range.  One of the apartments has a special loft that could be used as a bedroom and large closet, or could be a child's tree house! Enjoy fresh eggs from the chicken coop. Spacious 24' x 36'  2-story barn. Owner intended to take down the original  home once  the new home was finished. House is being sold ''as is''. The original home (from 1920) has forced hot air heat. The newer 4000 square feet addition (from 2010-2015) has radiant heat.  Seller has floor plans so that the next owner can finish the house if desired."
"Private Remarks": "Square footage is approximate.   Taxes and square footage to be verified by BA."
Addendum: "This property is one-of-a-kind. Close to all the Hudson Valley has to offer.  Conveniently located near uptown Kingston, Rhinebeck, Red hook, Woodstock and Saugerties.  Hop, Skip and Jump to Sojourner Truth State Park. Less than  20 minutes to Amtrak. Less than an our from skiing at Hunter Mountain and Belleayre. 2 hours from NYC."
