"Public Remarks": "ESCAPE TO YOUR OWN UTOPIA! Tucked away along scenic Swarte Kill Road in the Town of Esopus--with a coveted New Paltz mailing address.  This private 3-bedroom, 3-bathroom single-family residence offers a rare blend of modern comfort and expansive Hudson Valley acreage. Built in 2002 and encompassing 1,876 square feet of living space, the home is anchored on an extraordinary 5-acre parcel, delivering unmatched privacy, natural beauty, and room to roam.   During the winter months drive into your two car garage and unwind in front of the fireplace and slide into your hot tub or jacuzzi.  All the amenities your heart desires at your fingertips!"
