Directions: "From NYS-87 North.  Take Exit 18 (New Paltz).   After passing through the toll plaza, turn right onto NY-299 East towards Highland/Route 9W.   Follow NY-299 East for approximately 5 miles until it dead-ends at US-9W.   Turn left onto US-9W North (towards Esopus / Kingston).   Continue north on US-9W North for approximately 8 miles into the Town of Esopus.  Turn left onto County Route 16 / Old Post Road. (Look for signs for Old Post Road/Rifton).   Drive along Old Post Road over the railroad tracks to the first main intersection/stop sign.   Proceed straight through the intersection onto Swartekill Road.   Follow Swartekill Road until you reach 560 Swartekill Road on your left (Ann's Way)."
