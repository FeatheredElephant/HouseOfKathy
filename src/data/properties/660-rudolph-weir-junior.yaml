"Public Remarks": "Welcome to the 2 bedroom 1 bathroom LOVE SHACK!  This single-family property offering classic country cottage charm.  Built in 1960 on 1 acre of privacy Beautiful, quiet and rural cottage in Greene County.  Purchased in 2018 by current owner retaining original character of the property-- hardwoods floors etc...  New kitchen cabinets granite countertops, ceramic tiling. Stainless Appliances, Roof. Septic system, Leech field and new Hot water tanks in both House and Cabin.  Rustic cabin which sits nicely above the tranquil brook along the wooded ridgeline.  Enjoy a nice shower in the outdoors.  Great for a bed and breakfast or Air Bnb."
